name: Validate project

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Validate XML and project references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml](Get-Content './src/KinectKids/KinectKids.csproj') | Out-Null
          [xml](Get-Content './src/KinectBridge/KinectBridge.csproj') | Out-Null
          [xml](Get-Content './src/KinectKids/App.xaml') | Out-Null
          [xml](Get-Content './src/KinectKids/MainWindow.xaml') | Out-Null
          $project = [xml](Get-Content './src/KinectKids/KinectKids.csproj')
          $manager = New-Object System.Xml.XmlNamespaceManager($project.NameTable)
          $manager.AddNamespace('m', 'http://schemas.microsoft.com/developer/msbuild/2003')
          foreach ($node in $project.SelectNodes('//m:Compile|//m:Page|//m:ApplicationDefinition', $manager)) {
            $path = Join-Path './src/KinectKids' $node.Include
            if (-not (Test-Path $path)) { throw "Projektfilen refererar till en fil som saknas: $path" }
          }
          Write-Host 'Alla XAML/XML-filer och projektreferenser är giltiga.'
      - name: Compile WPF application
        shell: pwsh
        run: msbuild .\KinectKids.sln /m /p:Configuration=Release /p:Platform=x86 /p:UseKinectStub=true /verbosity:minimal
      - name: Validate Unity 3D prototype
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content './unity/KinectKids3D/Packages/manifest.json' -Raw | ConvertFrom-Json
          foreach ($module in @('com.unity.modules.audio', 'com.unity.modules.imgui',
              'com.unity.modules.particlesystem', 'com.unity.modules.physics')) {
            if ($manifest.dependencies.PSObject.Properties.Name -notcontains $module) {
              throw "Unity-modulen saknas i manifest.json: $module"
            }
          }
          $required = @(
            './unity/KinectKids3D/ProjectSettings/ProjectVersion.txt',
            './unity/KinectKids3D/Assets/Scripts/SpokjaktenGame.cs',
            './unity/KinectKids3D/Assets/Scripts/DarkRideWorld.cs',
            './unity/KinectKids3D/Assets/Scripts/GhostTarget.cs',
            './unity/KinectKids3D/Assets/Scripts/KinectV1AimProvider.cs',
            './unity/KinectKids3D/Assets/Scripts/KinectBridgeAimProvider.cs',
            './unity/KinectKids3D/Assets/Scripts/HauntedTextureFactory.cs',
            './unity/KinectKids3D/Assets/Scripts/LowPolyMeshFactory.cs',
            './unity/KinectKids3D/Assets/Scripts/PlayerPose.cs',
            './unity/KinectKids3D/Assets/Scripts/RideHazard.cs',
            './unity/KinectKids3D/Assets/Scripts/SideScare.cs',
            './unity/KinectKids3D/Assets/Scripts/HiddenMonster.cs',
            './unity/KinectKids3D/Assets/Scripts/BossProjectile.cs',
            './unity/KinectKids3D/Assets/Scripts/HauntedProp.cs',
            './unity/KinectKids3D/Assets/Scripts/MagicBolt.cs',
            './unity/KinectKids3D/Assets/Resources/Textures/CastleStone.jpg',
            './unity/KinectKids3D/Assets/Resources/Textures/CastleRoad.jpg',
            './unity/KinectKids3D/Assets/horror_music.mp3',
            './unity/KinectKids3D/Assets/Editor/KinectKidsProjectSetup.cs',
            './unity/KinectKids3D/Assets/Editor/KinectKidsWindowsBuild.cs',
            './unity/KinectKids3D/Assets/Editor/KinectKidsMusicSetup.cs',
            './THIRD_PARTY_NOTICES.md'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Unity-filen saknas: $path" }
          }
          $parts = Get-ChildItem './unity/KinectKids3D/MusicSource/RideMusic.base64.part*' | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Förväntade 6 musikdelar men hittade $($parts.Count)." }
          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $music = [Convert]::FromBase64String($encoded)
          if ($music.Length -ne 1945137) { throw "Musiken har fel storlek: $($music.Length)." }
          $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($music)).ToLowerInvariant()
          if ($sha -ne '8006838cc5aceee5b79eb48139061309e7e95a7388d47de60a9a5cab05728ca7') {
            throw "Musikens SHA-256 stämmer inte: $sha"
          }
          Write-Host 'Unity-prototypens struktur och manifest är giltiga.'
