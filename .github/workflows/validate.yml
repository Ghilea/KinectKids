name: Validate project

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate KinectBridge project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml](Get-Content './src/KinectBridge/KinectBridge.csproj') | Out-Null
          Write-Host 'KinectBridge-projektfilen är giltig.'
      - name: Validate Unity 2.5D platform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content './unity/KinectKids3D/Packages/manifest.json' -Raw | ConvertFrom-Json
          foreach ($module in @('com.unity.modules.audio', 'com.unity.modules.imgui',
              'com.unity.modules.particlesystem', 'com.unity.modules.physics')) {
            if ($manifest.dependencies.PSObject.Properties.Name -notcontains $module) {
              throw "Unity-modulen saknas i manifest.json: $module"
            }
          }
          $required = @(
            './unity/KinectKids3D/ProjectSettings/ProjectVersion.txt',
            # Gemensam plattform.
            './unity/KinectKids3D/Assets/KinectKids/Core/Bootstrap/KinectKidsPlatformRoot.cs',
            './unity/KinectKids3D/Assets/KinectKids/Core/Input/KinectKidsInputManager.cs',
            './unity/KinectKids3D/Assets/KinectKids/Menu/Scripts/MainMenuController.cs',
            './unity/KinectKids3D/Assets/Editor/KinectKidsPlatformBuilder.cs',
            # Aterandvandbar 2.5D-pipeline.
            './unity/KinectKids3D/Assets/KinectKids/Core/Scene25D/ParallaxController.cs',
            './unity/KinectKids3D/Assets/KinectKids/Core/Scene25D/ParallaxLayer.cs',
            './unity/KinectKids3D/Assets/KinectKids/Core/Scene25D/LayerSorting.cs',
            './unity/KinectKids3D/Assets/KinectKids/Core/Scene25D/CameraDepthScaler.cs',
            './unity/KinectKids3D/Assets/KinectKids/Core/Scene25D/ScriptedCamera.cs',
            './unity/KinectKids3D/Assets/KinectKids/Core/Scene25D/PuppetRig.cs',
            './unity/KinectKids3D/Assets/KinectKids/Core/Scene25D/PuppetBuilder.cs',
            './unity/KinectKids3D/Assets/KinectKids/Core/Scene25D/HazardBase.cs',
            './unity/KinectKids3D/Assets/KinectKids/Core/Scene25D/Hazards.cs',
            './unity/KinectKids3D/Assets/KinectKids/Core/Scene25D/DodgeAction.cs',
            './unity/KinectKids3D/Assets/KinectKids/Core/Scene25D/PlaceholderArt.cs',
            './unity/KinectKids3D/Assets/KinectKids/Core/Scene25D/Scene25DBackdrop.cs',
            # Greve Gast 2.5D chase.
            './unity/KinectKids3D/Assets/KinectKids/Games/GreveGast/Scripts/ChaseSceneDirector.cs',
            './unity/KinectKids3D/Assets/KinectKids/Games/GreveGast/Scripts/ChaseEnvironmentBuilder.cs',
            './unity/KinectKids3D/Assets/KinectKids/Games/GreveGast/Scripts/GreveGastSceneEntry.cs',
            './unity/KinectKids3D/Assets/KinectKids/Games/GreveGast/Scripts/GreveChaseSprites.cs',
            # Riktiga chase-sprites (utskurna ur asset-arken).
            './unity/KinectKids3D/Assets/KinectKids/Games/GreveGast/Resources/GreveChase/Player/player_idle.png',
            './unity/KinectKids3D/Assets/KinectKids/Games/GreveGast/Resources/GreveChase/Player/player_run_near.png',
            './unity/KinectKids3D/Assets/KinectKids/Games/GreveGast/Resources/GreveChase/GreveGast/greve_idle.png',
            './unity/KinectKids3D/Assets/KinectKids/Games/GreveGast/Resources/GreveChase/GreveGast/greve_reach.png',
            # Spokjakten 2.5D wagon-ride.
            './unity/KinectKids3D/Assets/KinectKids/Games/GhostHunt/GhostRide25D.cs',
            './unity/KinectKids3D/Assets/KinectKids/Games/GhostHunt/SpokjaktenSceneEntry.cs',
            # 2.5D larande- och rorelsespel.
            './unity/KinectKids3D/Assets/KinectKids/Games/Learning/Scripts/Learning25DGame.cs',
            './unity/KinectKids3D/Assets/KinectKids/Games/Learning/Scripts/Movement25D.cs',
            './unity/KinectKids3D/Assets/KinectKids/Games/Learning/Scripts/LearningGameEntry.cs',
            './unity/KinectKids3D/Assets/KinectKids/Games/Learning/Scripts/SimonGameEntry.cs',
            './unity/KinectKids3D/Assets/KinectKids/Games/Learning/Scripts/BalloonGameEntry.cs',
            './THIRD_PARTY_NOTICES.md'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Unity-filen saknas: $path" }
          }
          Write-Host 'Unity-plattformens 2.5D-pipeline och struktur är giltiga.'
